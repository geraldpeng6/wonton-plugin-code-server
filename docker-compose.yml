# code-server：网页版 VS Code。应用自己的认证已关（--auth none），入口只靠核心网关挡，
# 网页端口不向局域网发布。工作目录、扩展和设置都在插件数据目录，重建后还在。
# 共享文件夹 documents 以读写挂载，工作区里有指向它的软链接。上游 MIT，镜像按清单列表（index）的摘要固定。
name: code-server

services:
  code-server:
    image: codercom/code-server:4.145.2@sha256:09565f9e07f5624554e295e8bab0e2fec4a7c533eb3cff459ed6596a4d3d7c1c
    user: "${PUID}:${PGID}"
    # 核心默认给所有插件容器加 no-new-privileges，而镜像入口第一行用 setuid 的 fixuid 把 /home/coder
    # 的属主改给运行用户（见上游 /usr/bin/entrypoint.sh）；setuid 起不来时入口卡死，容器反复重启到
    # unhealthy。按插件规范退回 Docker 默认，这一项不算权限。
    security_opt:
      - no-new-privileges:false
    environment:
      TZ: ${TZ}
      # 镜像的 entrypoint 会把 HOME 固定成镜像里 coder 的 /home/coder，任意 uid 下不可写：
      # 指到数据目录，code-server 和终端里的工具（git、node）才有可写的主目录。
      HOME: /data/home
      # 镜像启动时往 $XDG_CONFIG_HOME/code-server/config.yaml 写默认配置，指到数据目录。
      XDG_CONFIG_HOME: /data/config
      # 镜像的 entrypoint 会先执行这个目录里的可执行脚本（见上游 /usr/bin/entrypoint.sh 的 ENTRYPOINTD）。
      ENTRYPOINTD: /wonton-init
    command:
      - --auth=none
      - --bind-addr=0.0.0.0:8080
      - --user-data-dir=/data/user-data
      - --extensions-dir=/data/extensions
      - --disable-telemetry
      - --disable-update-check
      - --disable-workspace-trust
      - /data/workspace
    volumes:
      - ${WONTON_APP_DATA}:/data
      - ${WONTON_SHARE_DOCUMENTS}:/documents
    configs:
      - source: init
        target: /wonton-init/10-init.sh
        mode: 0555
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      start_interval: 1s

configs:
  init:
    file: init/10-init.sh

x-wonton:
  spec: "0.7"
  id: com.coder.code-server
  version: 0.1.0
  kind: app
  title: { zh: 网页版 VS Code（code-server）, en: VS Code in the Browser (code-server) }
  description:
    zh: 浏览器里的 VS Code：打开网页就能写代码、改文件、开终端，电脑上不用装任何软件，文件都在家里的服务器上。
    en: "VS Code in your browser: write code, edit files and open a terminal from any computer with nothing to install; the files stay on your home server."
  icon: icon.png
  notices: [NOTICE]
  screenshots: [screenshots/home.png]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://coder.com
  license: MIT
  tags:
    zh: [开发, 编辑器]
    en: [Developer, Editor]
  about:
    zh: |
      浏览器里的 VS Code：写代码、开终端、装扩展都在网页里，打开就能用。

      工作目录、扩展和设置都放在插件数据目录，重装不丢。终端只在插件自己的容器里运行，看不到宿主机。

      工作区里的 documents 就是共享文件夹，可以读写；装扩展和语言包要出网。
    en: |
      VS Code in the browser: code, open a terminal and install extensions all in one web page — open it and start.

      The workspace, extensions and settings live in the plugin's data directory and survive reinstalls. The terminal runs inside the plugin's own container and never sees the host.

      "documents" in the workspace is the shared folder, readable and writable. Installing extensions and language packs needs internet access.
  release_notes:
    zh: 首个版本：网页版 VS Code，工作目录、扩展和设置随插件数据保留。
    en: "First release: VS Code in the browser; workspace, extensions and settings persist in the plugin data."
  webui:
    service: code-server
    port: 8080
    sso: none
  permissions:
    # 工作区要读写共享文件夹 documents；扩展市场和语言包从外网下载。
    - storage.share.documents:write
    - network.egress
  # 上游文档写最低 1G 内存；本机实测工作台开着约 930M（容器 RSS 峰值）。镜像 amd64 和 arm64 都有
  # （Docker Hub，codercom/code-server 4.145.0）。
  requirements:
    arch: [amd64, arm64]
    memory: 1G
